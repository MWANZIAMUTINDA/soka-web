<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in SOKA</title>
  <meta name="description" content="Open this SOKA invite in the app.">
  <style>
    :root {
      --bg: #F4F6FA; --surface: #FFFFFF; --text: #151A2D; --muted: #4A5372;
      --border: #E2E6EF; --accent: #123BCE; --on-accent: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B1026; --surface: #171D32; --text: #F4F6FA; --muted: #AAB4D0;
        --border: #293149; --accent: #E6FF00; --on-accent: #0B1026;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 28px; line-height: 1.25; margin: 0 0 8px; }
    h2 { font-size: 20px; margin: 32px 0 8px; }
    p, li { color: var(--text); }
    .lead { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
    ol, ul { padding-left: 22px; }
    li { margin: 6px 0; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 20px;
      border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none;
    }
    .button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    a { color: inherit; }
    .muted { color: var(--muted); font-size: 14px; }
    code { font-size: 14px; }
  </style>
</head>
<body>
  <main>

    <h1 id="title">Page not found</h1>
    <p class="lead" id="lead">This page doesn't exist. Go to the <a href="/soka-web/">SOKA home page</a>.</p>
    <div id="invite" hidden>
      <p><a class="button" id="open" href="#">Open in SOKA</a></p>
      <p class="muted">Don't have the app yet? Install SOKA from Google Play, then open this link again or type the code in <strong>Join with a code</strong>.</p>
    </div>
    <script>
      (function () {
        var m = location.pathname.match(/\/join\/([A-Za-z0-9]{6})\/?$/);
        if (!m) return;
        var code = m[1].toUpperCase();
        var url = 'soka://join/' + code;
        document.title = 'Join a SOKA tournament';
        document.getElementById('title').textContent = 'Join with code ' + code;
        document.getElementById('lead').textContent = 'You have been invited to a SOKA tournament.';
        document.getElementById('open').href = url;
        document.getElementById('invite').hidden = false;
        location.href = url;
      })();
    </script>
    <p class="muted" style="margin-top:40px"><a href="./">SOKA</a> · <a href="privacy">Privacy</a> · <a href="terms">Terms</a> · <a href="account-deletion">Delete account</a> · <a href="mailto:silvestermutinda74@gmail.com">silvestermutinda74@gmail.com</a></p>
  </main>
</body>
</html>
